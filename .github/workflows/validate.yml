name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  json-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jsonschema
      - run: python scripts/validate_json.py
